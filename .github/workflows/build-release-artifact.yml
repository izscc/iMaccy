name: Build macOS release artifact

on:
  push:
    branches:
      - feature/stability-prompt-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild \
            -project iMaccy.xcodeproj \
            -scheme iMaccy \
            -resolvePackageDependencies

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project iMaccy.xcodeproj \
            -scheme iMaccy \
            -destination 'platform=macOS' \
            -only-testing:iMaccyTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Distribution app
        run: |
          rm -rf build/ci-release
          xcodebuild build \
            -project iMaccy.xcodeproj \
            -scheme iMaccy \
            -configuration Distribution \
            -derivedDataPath build/ci-release/DerivedData \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package installable app
        run: |
          APP='build/ci-release/DerivedData/Build/Products/Distribution/iMaccy.app'
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/iMaccy"
          mkdir -p build/ci-release/output
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            build/ci-release/output/iMaccy-2.6.0.app.zip
          shasum -a 256 build/ci-release/output/iMaccy-2.6.0.app.zip \
            | tee build/ci-release/output/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMaccy-2.6.0-macOS
          path: build/ci-release/output/*
          if-no-files-found: error
          retention-days: 30
